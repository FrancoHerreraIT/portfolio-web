<section class="hero-section" id="inicio">
  <!-- Background decoration -->
  <div class="hero-bg-glow"></div>
  <div class="hero-grid-overlay"></div>

  <div class="container hero-container">

    <!-- LEFT: Text content -->
    <div class="hero-content">

      <div class="hero-badge">
        <span class="badge-dot"></span>
        Disponible para nuevos proyectos
      </div>

      <h1 class="hero-name">
        Franco<br>
        <span class="gradient-text">Herrera Moyano</span>
      </h1>

      <h2 class="hero-title">
        Desarrollo sistemas web
        <span class="title-separator">·</span>
        .NET &amp; Angular
        <span class="title-separator">·</span>
        Full-Stack
      </h2>

      <p class="hero-subtitle">
        Diseño y desarrollo sistemas web completos: desde la base de datos hasta la interfaz.
        Formación técnica respaldada por proyectos propios.
      </p>

      <!-- CTA Buttons -->
      <div class="hero-actions">
        <button class="btn-primary" (click)="scrollTo('proyectos')">
          <span class="material-icons">code</span>
          Ver proyectos
        </button>

        <button class="btn-secondary" (click)="scrollTo('contacto')">
          <span class="material-icons">mail_outline</span>
          Contacto
        </button>
      </div>

    </div>

    <!-- RIGHT: Photo -->
    <div class="hero-photo-wrapper">
      <div class="hero-photo-frame">
        <div class="photo-glow"></div>
        <div class="photo-ring"></div>
        <img
          src="/profile.jpg"
          alt="Franco Herrera Moyano"
          class="hero-photo"
          loading="eager"
        />
      </div>

      <!-- Floating tech badges -->
      <div class="floating-badge badge-1">.NET</div>
      <div class="floating-badge badge-2">Angular</div>
      <div class="floating-badge badge-3">SQL</div>
    </div>

  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" (click)="scrollTo('sobre-mi')">
    <div class="scroll-arrow"></div>
  </div>
</section>
